<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable | ScanID</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0B1628">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0B1628;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center}
.wrap{max-width:520px}
.code{font-family:'Space Grotesk',sans-serif;font-size:clamp(4rem,12vw,6.5rem);font-weight:700;color:#0EA5E9;line-height:1;letter-spacing:-.04em}
.beam{width:120px;height:3px;margin:1.4rem auto;background:linear-gradient(90deg,transparent,#0EA5E9,transparent);border-radius:2px}
h1{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700;margin-bottom:.9rem;letter-spacing:-.02em}
p{color:#94A3B8;line-height:1.7;margin-bottom:2rem}
.btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn-p{background:#0EA5E9;color:#0B1628;padding:.85rem 1.7rem;border-radius:10px;font-weight:700;text-decoration:none;font-size:.95rem;font-family:'Space Grotesk',sans-serif;transition:background .2s}
.btn-p:hover{background:#fff}
.btn-s{background:transparent;color:#fff;padding:.85rem 1.7rem;border-radius:10px;font-weight:500;text-decoration:none;font-size:.95rem;border:1px solid rgba(255,255,255,.18);transition:all .2s}
.btn-s:hover{border-color:#0EA5E9;color:#0EA5E9}
.contact{margin-top:2.2rem;font-size:.88rem;color:#64748B}
.contact a{color:#0EA5E9;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <div class="beam"></div>
  <h1>Cette page est introuvable</h1>
  <p>L'adresse demandée n'existe pas ou a été déplacée. Nos scanners n'ont rien détecté à cet endroit.</p>
  <div class="btns">
    <a class="btn-p" href="/">Retour à l'accueil</a>
    <a class="btn-s" href="/ressources.html">Voir les ressources</a>
  </div>
  <p class="contact">Un lien cassé&nbsp;? Signalez-le à <a href="mailto:contact@scanid.fr">contact@scanid.fr</a></p>
</div>
</body>
</html>
