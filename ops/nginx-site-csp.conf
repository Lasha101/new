# ScanID — Content-Security-Policy for the PUBLIC SITE, and for it only.
#
# A SNIPPET, included from INSIDE the `location /` block of
# deploy/nginx-travelapp.conf — not at server level. It contains one directive,
# and that is deliberate: it overrides the VALUE of $scanid_csp for the pages
# served from the root, and adds no header of its own. Adding one here would
# replace every header inherited from the server block (nosniff, X-Frame-Options,
# Referrer-Policy, and HSTS once enabled), silently. See the long note at the top
# of nginx-security-headers.conf.
#
# HOW LITTLE THIS GRANTS, AND WHY THAT MATTERS
# --------------------------------------------
# It grants ONE origin: https://formspree.io, for the lead forms. Everything else
# is 'self'. In particular it does NOT grant, and does not need:
#
#   script-src 'unsafe-inline'
#       Two pages carried a real inline <script> — the pricing calculator
#       (site/calculateur.html) and the checklist form handler
#       (site/checklist.html). frontend/scripts/assemble-site.mjs moves them into
#       files under /scripts/ in the BUILD COPY, so `script-src 'self'` covers
#       them. site/ itself is read-only and unchanged.
#
#       This is worth more than the tidiness: 'unsafe-inline' in script-src is
#       the single most dangerous token a policy can carry, and the site now
#       needs it nowhere. The application never had it either.
#
#   style-src / font-src https://fonts.googleapis.com https://fonts.gstatic.com
#       All 22 pages linked Google Fonts. The build now serves the same faces —
#       Space Grotesk 400/500/600/700, Inter 400/500 and Inter 400 italic, latin
#       and latin-ext, the exact subsets Google returns for a page in French —
#       from /fonts/ on this origin, via @fontsource. So `font-src 'self'` holds.
#
#       That also removes a genuine problem rather than merely a CSP entry: a
#       French site selling RGPD compliance was hotlinking a US font CDN on every
#       page load, which is a transfer of personal data. The application had
#       already self-hosted for exactly that reason
#       (frontend/tests/build/no-google-fonts.test.js keeps it honest).
#
#   'unsafe-eval', blob:, worker-src, manifest-src
#       Nothing on the site evaluates a string, creates an object URL, starts a
#       worker, or is a PWA. Those belong to the application, at /app/.
#
# WHAT IT DOES GRANT, AND WHY
# ---------------------------
#   style-src 'unsafe-inline'
#       Every page carries its whole stylesheet in an inline <style> block, plus
#       inline style="..." attributes. This is the one concession left, and it
#       matches what the application already needs for the same reason.
#
#   connect-src + form-action https://formspree.io
#       The four lead forms (site/essai.html, site/calculateur.html,
#       site/checklist.html, site/iftm/index.html) POST to
#       https://formspree.io/f/xqeowdvk. checklist.html submits it with fetch(),
#       governed by connect-src; the other three submit the form element itself,
#       governed by form-action. Both are needed, and missing either one fails
#       silently in a different way.
#
#       This is the ONLY thing on the site that a stale nginx configuration can
#       still break: fonts and scripts are now correct under any policy that
#       allows 'self', but no static file can make a cross-origin POST allowed.
#
# KEEP IT ON ONE LINE — same trap as the application's policy: a backslash
# inside an nginx quoted string is a literal backslash, so a "readable"
# multi-line version parses fine and then emits a header browsers throw away.
set $scanid_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://formspree.io; object-src 'none'; base-uri 'self'; form-action 'self' https://formspree.io; frame-ancestors 'none'";
