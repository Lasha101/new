# ScanID — security response headers.
#
# GENERATED FILE, AND A SNIPPET. REVIEW IT LINE BY LINE BEFORE THE NEXT DEPLOY.
#
# This file IS now applied. deploy/nginx-travelapp.conf includes it from its
# server block:
#
#     server {
#         ...
#         include /opt/travelapp/ops/nginx-security-headers.conf;
#     }
#
# and .github/workflows/deploy.yml rsyncs ops/ to /opt/travelapp/ops/ just
# before it rsyncs deploy/, so the include target exists by the time the vhost
# that references it lands. The deploy then runs `nginx -t` and FAILS the deploy
# if this file is missing or does not parse — so do not delete or rename it
# without removing the include line from deploy/nginx-travelapp.conf first.
#
# Headers reach browsers only after a reload: `nginx -t && systemctl reload
# nginx`, which the deploy does automatically where passwordless sudo allows.
#
# ┌───────────────────────────────────────────────────────────────────────────┐
# │ DO NOT ENABLE Strict-Transport-Security UNTIL HTTPS WORKS.                │
# │                                                                           │
# │ HSTS tells every browser that has ever visited to refuse plain HTTP to    │
# │ this hostname for max-age seconds — 63072000 below is two years. Send it  │
# │ before the certificate is installed and working and the site becomes      │
# │ unreachable for everyone who received the header, and you cannot take it  │
# │ back: clearing it requires each visitor to purge it by hand, or you must  │
# │ serve max-age=0 over WORKING HTTPS, which is the thing you do not have.   │
# │                                                                           │
# │ The HSTS line is therefore commented out. Uncomment it only after:        │
# │   1. https://your-domain loads with a valid certificate,                  │
# │   2. renewal is proven (certbot renew --dry-run),                         │
# │   3. every subdomain is on HTTPS too, if you keep includeSubDomains.      │
# └───────────────────────────────────────────────────────────────────────────┘
#
# One nginx trap that applies to this whole file: `add_header` in a nested
# block REPLACES every add_header inherited from the parent, it does not merge.
# deploy/nginx-travelapp.conf has five location blocks. If you ever add an
# add_header inside one of them, every header below silently stops being sent
# for that location. Keep all headers at server level — include this file once,
# in the server block — and vary a value with a variable, the way the CSP below
# does, rather than adding a second add_header lower down.
#
# THE OBVIOUS REMEDY IS WRONG FOR THE CSP SPECIFICALLY. "Repeat the include in
# the location, then add the header you want" restores the other three headers,
# but it leaves TWO Content-Security-Policy headers on the response — and two
# policies are enforced as their INTERSECTION, not as the last one written. A
# location that meant to ALLOW something ends up allowing nothing extra, and the
# page breaks with no clue in the config as to why. That is why the policy is
# sent from the variable $scanid_csp: one add_header, one header on the wire,
# and a location that needs a different policy overrides the VALUE with `set`.

# --- Transport -------------------------------------------------------------
# Two years, preload-eligible. Read the box above before uncommenting.
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# --- Content sniffing ------------------------------------------------------
# Stops the browser from second-guessing Content-Type. Without it an uploaded
# file served back with the wrong type can be re-interpreted as HTML or script.
add_header X-Content-Type-Options "nosniff" always;

# --- Framing ---------------------------------------------------------------
# ScanID is never embedded in another site, so deny framing outright. This is
# the legacy header; frame-ancestors in the CSP below is the modern equivalent
# and both are sent, because X-Frame-Options is what old browsers understand.
add_header X-Frame-Options "DENY" always;

# --- Referrer --------------------------------------------------------------
# Same-origin requests keep the full URL; cross-origin ones send only the
# origin, and nothing at all when downgrading to HTTP. Keeps any identifier
# that ends up in a path out of third-party logs.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# --- Content-Security-Policy ----------------------------------------------
# Derived from the actual built output of this repository (npm run build), not
# from a template. Every non-'self' token below is justified by a specific line
# of application code, named in its comment. Anything not needed is absent:
#
#   * NO Google Fonts origins. Fonts are self-hosted via @fontsource (npm) and
#     bundled by Vite — see frontend/src/main.jsx. There is no runtime request
#     to fonts.googleapis.com or fonts.gstatic.com to allow.
#   * NO Google Cloud Vision origin. Vision is called server-side by the Python
#     backend; the browser never talks to it, so it does not belong in a policy
#     that only constrains the browser.
#
# When you change the frontend, re-derive this. A CSP that has drifted from the
# app either breaks it or protects nothing.
#
# THIS IS THE DEFAULT, AND IT IS THE APPLICATION'S POLICY. Since the public site
# took over the origin root, one server serves two things with genuinely
# different needs: the application under /app/, which handles identity documents
# and gets the tight policy below, and the marketing pages at the root, which
# were authored elsewhere and need Google Fonts, inline <script> and a Formspree
# endpoint. Their policy is ops/nginx-site-csp.conf, included by the `location /`
# block of deploy/nginx-travelapp.conf, which overrides $scanid_csp for that
# location only.
#
# Everything not named there — /app/, /api/, /events, an unmatched path — falls
# through to the value set here. The default is the strict one on purpose: a new
# location added tomorrow inherits the policy that protects the application, and
# has to opt out deliberately to get anything looser.
#
# KEEP THIS ON ONE LINE. nginx is not a shell: inside a quoted string a
# trailing backslash is a literal backslash and the newline stays in the value,
# so a "readable" multi-line version compiles cleanly, passes `nginx -t`, and
# then emits a broken multi-line header that browsers discard — i.e. no policy
# at all, silently. The per-directive reasoning is in the comment block below.
set $scanid_csp "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' data:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

# One add_header, one CSP on the wire, whichever zone answered. An EMPTY
# variable makes nginx omit the header entirely and without complaint, so if
# this snippet is ever included somewhere that does not reach the `set` above,
# the result is no policy rather than a broken one — ops/tests/test-nginx-headers.sh
# asserts the header is present and non-empty on both zones for exactly that reason.
add_header Content-Security-Policy $scanid_csp always;

# Directive by directive, and why:
#
# default-src 'self'
#     The floor. Everything not overridden below may only come from this origin.
#     It also covers media-src, child-src and the rest by inheritance.
#
# script-src 'self' 'unsafe-eval'
#     No 'unsafe-inline': Vite emits external bundles and the built index.html
#     carries no inline <script> (VitePWA is configured injectRegister: null).
#
#     'unsafe-eval' IS present, and it is not decoration — see the heic2any
#     section at the bottom, which is no longer a caveat but a measured result.
#     Without it, HEIC uploads HANG the whole upload queue. Removing it means
#     replacing heic2any; do not drop it before then.
#
# style-src 'self' 'unsafe-inline'
#     REQUIRED, not decoration, and the one token here worth wanting to remove.
#     frontend/src/App.jsx has a `GlobalStyles` component that renders a literal
#     <style> element (App.jsx:44), plus ~35 React `style={{...}}` attributes.
#     Both are inline styles as far as CSP is concerned. Drop 'unsafe-inline'
#     and the app renders unstyled. Removing it means moving that block into
#     scanid-app.css and replacing the style props — a frontend change, out of
#     scope here, and noted in ops/README.md as the one real CSP debt.
#
# img-src 'self' blob: data:
#     blob:  frontend/src/upload/imagePrep.js and App.jsx call
#            URL.createObjectURL() and load the result into an <img> to decode,
#            rotate and compress a captured document before upload.
#     data:  imagePrep.js:52 embeds a tiny base64 JPEG (PROBE_JPEG_ORIENTATION_6)
#            used to detect whether the browser already applies EXIF rotation.
#            Without data: that probe fails and every photo from a phone risks
#            being rotated twice.
#
# font-src 'self'
#     Safe here, but check this after any dependency bump — see the note below.
#
# connect-src 'self' data:
#     'self'  the API and the SSE stream are same-origin (/api/, /events) via
#             the reverse proxy. Keeping them same-origin is also what lets the
#             HttpOnly session cookie work in Safari.
#     data:   imagePrep.js reads that same orientation probe with `fetch()`, and
#             fetch() against a data: URI is governed by connect-src, not img-src.
#             This one is easy to miss because the failure is silent.
#
# worker-src 'self' blob:
#     'self'  the PWA service worker (/sw.js, registered by src/pwa.js).
#     blob:   heic2any spawns `new Worker(URL.createObjectURL(...))` to decode
#             HEIC photos off the main thread. iPhones shoot HEIC by default, so
#             this is the common path on the target device, not an edge case.
#
# manifest-src 'self'
#     The PWA manifest. Some browsers do not fall back to default-src for it.
#
# object-src 'none'
#     No <object>, <embed> or <applet>. The app has none, and these are a
#     classic route to plugin-based script execution.
#
# base-uri 'self'
#     Stops an injected <base href> from re-pointing every relative URL —
#     including the ones that load the application's own scripts.
#
# form-action 'self'
#     Every form in App.jsx is handled by onSubmit with preventDefault; none has
#     an action attribute. This makes an injected one unable to post credentials
#     off-site.
#
# frame-ancestors 'none'
#     Clickjacking. The modern counterpart to X-Frame-Options above.

# --- THE font-src TRAP — checked, and the finding ---------------------------
#
# Vite inlines any asset smaller than `build.assetsInlineLimit` (default 4096
# bytes) as a data: URI. Font subsets are small. If a woff2 falls under that
# limit it is inlined, a bare `font-src 'self'` blocks it, and the app silently
# falls back to a system typeface — no error, just wrong-looking text.
#
# This was checked against a real build rather than assumed:
#
#   $ npm run build
#   $ grep -o "url(data:" dist/assets/*.css dist/assets/index-*.js   # no matches
#   $ find dist/assets -name '*.woff2' -printf '%s %f\n' | sort -n | head -1
#     4204 space-grotesk-vietnamese-700-normal-DMty7AZE.woff2
#
# No data: URI anywhere in the build, so `font-src 'self'` is correct and stays
# tight. But the margin is 108 bytes: the smallest subset is 4204 against a
# 4096 limit. A @fontsource bump that shaves a few glyphs off the Vietnamese
# subset would cross it, and nothing would fail loudly.
#
# THIS IS NOW HANDLED. frontend/vite.config.js sets:
#
#     build: { assetsInlineLimit: 0 }   // never inline; assets stay real files
#
# so no asset can be inlined as a data: URI regardless of its size, and
# `font-src 'self'` is permanently correct rather than correct by 108 bytes.
# Setting it changed nothing in the output at the time (the built file set was
# identical before and after), so it costs nothing and removes the trap.
#
# You therefore no longer need to re-run the two commands above after a
# dependency bump. If that option is ever removed, you do — and the choice would
# again be to restore it (preferred — the CSP stays as written) or to add `data:`
# to font-src and accept the weaker policy.

# --- Why 'unsafe-eval' is in script-src — MEASURED, not assumed -------------
#
# An earlier draft of this file shipped `script-src 'self'` and recorded the
# heic2any question as "not verified in a browser". It has now been verified,
# and the strict version was wrong: it does not merely degrade HEIC support, it
# HANGS THE UPLOAD QUEUE.
#
# frontend/dist/assets/heic2any-*.js is an Emscripten build of libheif. Its
# embind glue calls `new Function` in createNamedFunction:
#
#     new Function("body","return function "+A+'(){ "use strict"; ... }')
#
# That runs unconditionally while embind registers its error types, i.e. at
# worker-script evaluation, not on some rare branch. heic2any decodes inside a
# worker it spawns from a blob URL, and a blob worker INHERITS the creating
# document's CSP — so `script-src 'self'` blocks it there too.
#
# How it was measured: the built bundle was served over HTTP twice, once with
# this exact header and once without, and driven with headless Chromium:
#
#   CSP off:  heic2any settles — rejects a non-HEIC blob with
#             "ERR_LIBHEIF format not supported"
#   CSP on:   NEVER SETTLES. pageerror: "Evaluating a string as JavaScript
#             violates the following Content Security Policy directive because
#             'unsafe-eval' is not an allowed source of script"
#
# The consequence is worse than a lost optimisation. The worker dies during
# script evaluation, before its message handler exists, so heic2any's promise
# never settles — it does not reject. The try/catch around convertHeicToJpeg in
# frontend/src/upload/imagePrep.js therefore NEVER RUNS, and its
# "on failure, upload the original" fallback never fires. frontend/src/upload/
# uploadQueue.js drains serially with `await` and has no timeout, so one HEIC
# stalls every document queued behind it, indefinitely, until a page reload.
#
# Hence 'unsafe-eval'. It is a real weakening of script-src and it is the one
# token in this policy that should not be permanent.
#
# To remove it, replace heic2any with a wasm-based decoder and switch to
# 'wasm-unsafe-eval', which is far narrower (it permits WebAssembly compilation
# and NOT `new Function`, so it is not a drop-in substitute here). Re-run the
# measurement above before changing this line in either direction.
#
# Still worth checking on a real iPhone: the above was measured on Chromium
# because WebKit could not launch in the environment where it was run. Blob
# workers inheriting the document policy is spec-mandated, so Safari is expected
# to behave the same, but that is reasoning, not a measurement.
