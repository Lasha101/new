# Production nginx vhost for the travel app — single source of truth, synced
# to the VPS by .github/workflows/deploy.yml (rsync to /opt/travelapp/deploy/).
#
# TLS
# ---
# The certificate is issued by certbot with `certonly --webroot`, NEVER by the
# nginx plugin. `certbot --nginx` rewrites this file in place, and the deploy's
# `rsync --delete` over deploy/ erases that work on the next push — HTTPS would
# die silently at the next deploy. Renewal runs from certbot.timer and uses the
# same webroot, so the ACME location in the port-80 block below must stay
# reachable over plain HTTP and must not be caught by the redirect.
#
#   certbot certonly --webroot -w /opt/travelapp/frontend-dist \
#     -d scanid.fr -d www.scanid.fr
#
# ONE-TIME install on the VPS (as root). ORDER MATTERS: this file `include`s
# /opt/travelapp/ops/nginx-security-headers.conf, so that file must already be
# on disk or `nginx -t` fails and the reload is refused. Deploy first (which
# rsyncs ops/), then repoint the symlink:
#
#   ls /opt/travelapp/ops/nginx-security-headers.conf   # must exist FIRST
#   ln -sfn /opt/travelapp/deploy/nginx-travelapp.conf /etc/nginx/sites-enabled/travelapp
#   rm -f /etc/nginx/sites-enabled/default   # if the stock default site is enabled
#   nginx -t && systemctl reload nginx
#
# To let deploys reload nginx automatically, add to sudoers (visudo):
#   deploy ALL=(root) NOPASSWD: /usr/sbin/nginx -t, /bin/systemctl reload nginx
# Without it, deploys still sync this file; reload it manually after changes.


# ---------------------------------------------------------------------------
# PORT 80 — ACME challenges, and a redirect to HTTPS for everything else.
# ---------------------------------------------------------------------------
# `default_server` and the IPv6 listener are NOT decoration — they match the
# vhost that was hand-installed on the VPS and served the site until this file
# replaced it. Dropping `listen [::]:80` would silently cut off every IPv6
# client; dropping `default_server` would leave requests that match no
# server_name unhandled, including requests to the bare IP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Hide the nginx version from error pages and the Server header.
    server_tokens off;

    # Let's Encrypt renewal. certbot writes its token under this webroot, so
    # the path is served over plain HTTP and is deliberately NOT redirected.
    # `^~` makes this prefix win over any regex location.
    location ^~ /.well-known/acme-challenge/ {
        root /opt/travelapp/frontend-dist;
        default_type "text/plain";
    }

    # Everything else goes to the canonical HTTPS host. Redirecting to a fixed
    # name rather than $host means a request to the bare IP lands on a name the
    # certificate actually covers, instead of producing a warning.
    location / {
        return 301 https://scanid.fr$request_uri;
    }
}


# ---------------------------------------------------------------------------
# PORT 443 — the application.
# ---------------------------------------------------------------------------
server {
    # nginx 1.24 (Ubuntu 24.04) has no standalone `http2 on;` directive — that
    # arrived in 1.25.1. HTTP/2 is enabled on the listen line here.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name scanid.fr www.scanid.fr;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/scanid.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scanid.fr/privkey.pem;

    # Mozilla "intermediate", trimmed to the ECDHE suites. The DHE suites are
    # deliberately absent: they need an ssl_dhparam file, nginx no longer ships
    # built-in DH parameters, and every client that reaches this app supports
    # ECDHE. OCSP stapling is also absent on purpose — Let's Encrypt has retired
    # its OCSP responder, so `ssl_stapling on` would only log a warning.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /opt/travelapp/frontend-dist;
    index index.html;

    # Security response headers (X-Content-Type-Options, X-Frame-Options,
    # Referrer-Policy, CSP). The file is rsynced to /opt/travelapp/ops/ by
    # .github/workflows/deploy.yml, alongside this one.
    #
    # It is included HERE, at server level, and deliberately not inside any
    # location block: `add_header` in a nested block REPLACES every add_header
    # inherited from the parent rather than merging with it. The four location
    # blocks below therefore add no headers of their own — if you ever add one,
    # repeat this include in that block or every header here stops being sent
    # for that path, silently.
    #
    # HSTS ships commented out inside the snippet. Enable it only after HTTPS
    # has been stable for a week — see the box at the top of that file.
    include /opt/travelapp/ops/nginx-security-headers.conf;

    # SPA fallback: unknown paths serve the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Uploads: stream the request body straight to uvicorn instead of
    # spooling the whole file to nginx's disk first, and allow documents
    # up to 50 MB (nginx default is 1 MB, which rejects large PDFs).
    location /api/passports/upload-and-extract/ {
        proxy_pass http://127.0.0.1:8001/passports/upload-and-extract/;
        client_max_body_size 50m;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-Sent Events: never buffer, keep the connection open.
    location /api/events {
        proxy_pass http://127.0.0.1:8001/events;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 24h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other API routes. The /api prefix is stripped: backend routes have
    # no /api prefix, so the trailing slash on proxy_pass matters.
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        client_max_body_size 50m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Carried over from the hand-installed vhost this file replaced.
        # X-Forwarded-Proto is what lets the app know the original scheme once a
        # TLS terminator sits in front; the 1h timeout was already in force for
        # every /api/ call, so keeping it changes nothing today and avoids
        # silently cutting a long export at nginx's 60s default.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }
}
