# Deploys the app to the production VPS over SSH.
#
# DISABLED UNTIL THE VPS EXISTS: this workflow only runs when triggered
# manually (Actions tab -> Deploy -> Run workflow). Once the server is
# provisioned, deployment on every push to master can be enabled by
# uncommenting the `push:` trigger below.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST             server IP or hostname
#   VPS_USER             SSH user (e.g. deploy)
#   VPS_SSH_PRIVATE_KEY  private key whose public half is in the server's
#                        ~/.ssh/authorized_keys
#
# One-time server provisioning this workflow expects (done once, by hand):
#   - PostgreSQL running locally with the app database created
#   - /opt/travelapp/backend/.env with the production values
#     (SECRET_KEY, ADMIN_PASSWORD, GCP_CREDS_JSON, DATABASE_URL)
#   - a systemd unit `travelapp.service` running:
#     /opt/travelapp/venv/bin/python -m uvicorn main:app --port 8001
#     (WorkingDirectory=/opt/travelapp/backend)
#   - nginx serving /opt/travelapp/frontend-dist as the site root and
#     proxying /api/* to 127.0.0.1:8001 WITH the /api prefix stripped —
#     backend routes have no /api prefix, so the trailing slash matters:
#       location /api/ { proxy_pass http://127.0.0.1:8001/; }
#     (also add proxy_buffering off; for the /events SSE endpoint)
#   - sudoers entry allowing the deploy user to restart travelapp.service

name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload backend and frontend build
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete \
            --exclude '.env' --exclude '__pycache__' \
            backend/ "$VPS_USER@$VPS_HOST:/opt/travelapp/backend/"
          rsync -az --delete \
            frontend/dist/ "$VPS_USER@$VPS_HOST:/opt/travelapp/frontend-dist/"
          # ops/ BEFORE deploy/: deploy/nginx-travelapp.conf now `include`s
          # /opt/travelapp/ops/nginx-security-headers.conf, and nginx -t below
          # fails the deploy if that file is not on disk. Syncing it first means
          # the include target always exists by the time the vhost referencing
          # it lands. The shell scripts in ops/ are operator tools; syncing them
          # does not schedule or run anything.
          rsync -az --delete \
            ops/ "$VPS_USER@$VPS_HOST:/opt/travelapp/ops/"
          rsync -az --delete \
            deploy/ "$VPS_USER@$VPS_HOST:/opt/travelapp/deploy/"

      - name: Install backend dependencies and restart service
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            set -e
            cd /opt/travelapp
            [ -d venv ] || python3 -m venv venv
            venv/bin/pip install --quiet -r backend/requirements.txt
            sudo systemctl restart travelapp.service
            # THE ONE SILENT-AND-FATAL FAILURE OF THIS ARRANGEMENT.
            #
            # deploy/nginx-travelapp.conf `include`s files from ops/. If one of
            # them is not on disk, nothing looks wrong today: nginx keeps serving
            # from the configuration already in memory. The bill arrives at the
            # next reload or, far worse, the next REBOOT — a missing include is
            # [emerg], so nginx refuses to START and the whole site goes down,
            # with nothing having changed since the deploy that caused it.
            #
            # `nginx -t` would catch it, but on this server the deploy account
            # sudo rule covers only travelapp.service, so that test is usually
            # skipped. A plain readability check needs no privileges at all.
            # The usual cause is a file under ops/ that was never committed.
            missing_include=0
            for inc in $(sed -n "s/^[[:space:]]*include[[:space:]]\+\([^;]*\);.*/\1/p" /opt/travelapp/deploy/nginx-travelapp.conf); do
              if [ ! -r "$inc" ]; then
                echo "ERROR: the vhost includes $inc, which is not on disk."
                missing_include=1
              fi
            done
            if [ "$missing_include" = "1" ]; then
              echo "  nginx would refuse to START with that include missing, so the next reboot would take the site down."
              echo "  Check that every file under ops/ referenced by deploy/nginx-travelapp.conf is committed."
              exit 1
            fi

            # Reload nginx so the synced deploy/nginx-travelapp.conf takes
            # effect. Three outcomes are kept distinct: a missing sudo
            # permission is a NOTE (deploy stays green), but a FAILING config
            # test must fail the deploy loudly — the broken file is already
            # synced to disk and would silently arm itself on the next reload.
            nginx_reloaded=no
            nginx_test_output=$(sudo -n /usr/sbin/nginx -t 2>&1) && nginx_test_rc=0 || nginx_test_rc=$?
            if [ "$nginx_test_rc" -eq 0 ]; then
              sudo -n /bin/systemctl reload nginx
              nginx_reloaded=yes
              echo "nginx config tested and reloaded."
            elif echo "$nginx_test_output" | grep -qi "password is required"; then
              echo "NOTE: nginx not reloaded (no passwordless sudo); reload manually if deploy/nginx-travelapp.conf changed."
            else
              echo "ERROR: nginx config test failed:"
              echo "$nginx_test_output"
              exit 1
            fi
            sleep 3
            # Health check on an endpoint that behaves the SAME in development
            # and in production.
            #
            # This used to probe /docs and /api/openapi.json with `curl -sf`.
            # Both return 200 in development but 404 once ENVIRONMENT=production
            # (the backend closes its docs deliberately), and -f treats 404 as
            # failure — so turning on the hardening would have failed the deploy
            # on a perfectly healthy release.
            #
            # /destinations/ is 401 in BOTH modes, and asserting the exact code
            # checks more than the old probe did: 401 proves the route exists,
            # the auth dependency actually ran, and — on the second line — that
            # nginx proxied /api/ through to uvicorn. A dead backend gives 000
            # or 502, a broken proxy 404, and either fails this.
            #
            # The second probe goes over HTTPS, not port 80. Since the vhost
            # gained a TLS block, port 80 answers every path except the ACME
            # challenge with a 301 to https://scanid.fr — so the old
            # `http://127.0.0.1/api/...` probe would report 301 and fail the
            # deploy on a healthy release, exactly the way the /docs probe
            # described above did. `--resolve` pins the name to the loopback so
            # the check never leaves the machine while still presenting the
            # right SNI, which means it also proves the certificate is valid
            # and the 443 server block is the one serving /api/.
            api_code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8001/destinations/)
            [ "$api_code" = "401" ] || { echo "ERROR: backend health check returned $api_code, expected 401"; exit 1; }
            proxy_code=$(curl -s -o /dev/null -w '%{http_code}' \
              --resolve scanid.fr:443:127.0.0.1 https://scanid.fr/api/destinations/)
            [ "$proxy_code" = "401" ] || { echo "ERROR: nginx /api/ proxy over HTTPS returned $proxy_code, expected 401"; exit 1; }

            # --- The two halves of the front end -------------------------
            # Until these existed, every way of getting the front end wrong
            # shipped green: the site missing from the build, the app shell
            # winning the root, /app/ 404ing, the site erased by the dist rsync.
            # `nginx -t` above catches a parse error and nothing more.
            #
            # They assert CONTENT, not a status code, because a status code
            # proves nothing here: a misconfigured root answers 200 with the
            # wrong page.
            #
            # NO APOSTROPHES ANYWHERE BELOW. The whole remote command is a
            # single-quoted argument to ssh, so one apostrophe ends the quoting
            # and kills the deploy on a syntax error. Double quotes are used for
            # every grep pattern for the same reason.
            #
            # A FAILED PROBE IS NOT ALWAYS A FAILED DEPLOY. These assert the
            # state the NEW vhost produces. On this server the deploy account
            # sudo rule covers only travelapp.service, so nginx is NOT reloaded
            # and the running config is still the previous one — which this file
            # already treats as a NOTE rather than an error. Failing the deploy
            # for it would be blaming the deploy for a permission it was never
            # given. So: hard failure when nginx WAS reloaded, and a loud,
            # unmissable action item when it was not.
            front_end_pending=no
            probe_failed() {
              if [ "$nginx_reloaded" = "yes" ]; then
                echo "ERROR: $1"
                exit 1
              fi
              front_end_pending=yes
              echo "PENDING (nginx not reloaded): $1"
            }

            # The root must be the MARKETING SITE. Matching the rewritten
            # « Connexion » link proves two things at once: the site is what
            # answers /, and scripts/assemble-site.mjs really ran (the source
            # page says https://app.scanid.fr, which has no DNS record).
            root_body=$(curl -s --resolve scanid.fr:443:127.0.0.1 https://scanid.fr/)
            echo "$root_body" | grep -q "href=\"/app/\"" \
              || probe_failed "https://scanid.fr/ is not the assembled marketing site"

            # /app/ must be the REACT SHELL, built with base /app/. Grepping the
            # asset path proves the shell is present AND that the base is right,
            # so a vite.config.js regression fails here too.
            app_body=$(curl -s --resolve scanid.fr:443:127.0.0.1 https://scanid.fr/app/)
            echo "$app_body" | grep -q "/app/assets/index-" \
              || probe_failed "https://scanid.fr/app/ is not the application shell"

            # The self-hosted typefaces must be served from this origin. If this
            # 404s the pages fall back to a system font with no visible error.
            font_code=$(curl -s -o /dev/null -w "%{http_code}" \
              --resolve scanid.fr:443:127.0.0.1 https://scanid.fr/fonts/site.css)
            [ "$font_code" = "200" ] \
              || probe_failed "https://scanid.fr/fonts/site.css returned $font_code, expected 200 (the pages would render in a system typeface)"

            # An unknown path must be a real 404, served from the 404.html the
            # site ships. If 404.html ever went missing from the build,
            # `error_page 404 /404.html` would redirect to a path that 404s in
            # turn and nginx would answer 500 — a typo becoming a server error.
            nf_code=$(curl -s -o /dev/null -w "%{http_code}" \
              --resolve scanid.fr:443:127.0.0.1 https://scanid.fr/__deploy_probe_404)
            [ "$nf_code" = "404" ] \
              || probe_failed "an unknown path returned $nf_code, expected 404 (404.html missing, or the old SPA catch-all is still loaded)"

            if [ "$front_end_pending" = "yes" ]; then
              echo ""
              echo "=================================================================="
              echo " ACTION REQUIRED ON THE SERVER - the deploy is not allowed to do it"
              echo "=================================================================="
              echo " The new vhost and header snippets are on disk under /opt/travelapp,"
              echo " but nginx still has the previous configuration loaded. The deploy"
              echo " account sudo rule covers only travelapp.service."
              echo ""
              echo " From an account with sudo, on the VPS:"
              echo "     sudo nginx -t && sudo systemctl reload nginx"
              echo ""
              echo " Until that is run, the site is served and reads correctly - the"
              echo " typefaces and the page scripts are self-hosted, so they are"
              echo " unaffected - but the four Formspree lead forms are refused by the"
              echo " old policy, and an unknown path answers 200 with the homepage"
              echo " instead of 404.html."
              echo "=================================================================="
            fi

            echo "Deployed; the site answers /, the app answers /app/, and the API proxies."
          '
