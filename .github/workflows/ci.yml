name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend — install, compile & boot test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: travelapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Compile all backend modules
        working-directory: backend
        run: python -m py_compile *.py

      - name: Boot app against PostgreSQL and smoke-test
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:ci@127.0.0.1:5432/travelapp
          SECRET_KEY: ci-only-secret-key
          ADMIN_PASSWORD: ci-only-admin-password
        run: |
          python -m uvicorn main:app --port 8001 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8001/docs >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8001/docs >/dev/null
          curl -sf http://127.0.0.1:8001/openapi.json | grep -q '"/users/register"'
          # Startup tolerates an unreachable DB, so prove connectivity for real:
          # table creation + admin bootstrap must have happened.
          PGPASSWORD=ci psql -h 127.0.0.1 -p 5432 -U postgres -d travelapp \
            -tAc "SELECT count(*) FROM users;" | grep -qx 1
          echo "App booted, tables created, admin seeded, API schema served."

  frontend:
    name: Frontend — install & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build
